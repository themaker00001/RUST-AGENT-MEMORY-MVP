[workspace]
resolver = "2"
members = [
    "crates/memory-core",
    "crates/ollama-client",
    "crates/memory-store",
    "crates/memory-retriever",
    "crates/context-builder",
    "crates/agent-cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Agent Memory OS"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
indicatif = "0.17"
termimad = "0.30"
colored = "2"
ratatui = "0.26"
crossterm = "0.27"

memory-core = { path = "crates/memory-core" }
ollama-client = { path = "crates/ollama-client" }
memory-store = { path = "crates/memory-store" }
memory-retriever = { path = "crates/memory-retriever" }
context-builder = { path = "crates/context-builder" }
